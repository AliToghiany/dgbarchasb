name: Build Android APK

on:
  push:
    branches: [ '**' ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK (Installable on any Android phone)
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ModiriatSefareshPro-v3.3.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ModiriatSefareshPro-v3.3-APK
          path: ModiriatSefareshPro-v3.3.apk
